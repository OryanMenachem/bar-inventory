<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>מלאי בר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --line:#dcdcdc; --line-soft:#eee;
    --text:#1e1e1e; --muted:#6b6b6b; --faint:#9a9a9a;
    --btn:#f3f3f3; --btn-line:#c8c8c8;
    --accent:#0a6ebd; --danger:#c0392b;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    max-width:520px;margin:0 auto;min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10;
  }
  .title{font-size:16px;font-weight:700;}
  .add{
    width:44px;height:44px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--accent);font-size:24px;cursor:pointer;
  }
  .search{padding:14px 16px;}
  .search label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input,textarea{
    width:100%;font-family:inherit;font-size:15px;color:var(--text);
    border:1px solid var(--btn-line);border-radius:8px;padding:11px 12px;background:#fff;
  }
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .count{padding:0 18px 8px;font-size:12px;color:var(--faint);font-family:var(--mono);}

  .list{display:flex;flex-direction:column;gap:12px;padding:0 16px 24px;}
  .card{
    width:100%;text-align:right;font:inherit;color:inherit;cursor:pointer;
    background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);padding:14px 16px;
    display:flex;gap:12px;align-items:center;
  }
  .card:active{transform:scale(.99);}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:#eef4fb;color:var(--accent);}
  .c-blue{background:#eef4fb;color:#0a6ebd;}
  .c-red{background:#fdecea;color:#a5271b;}
  .c-green{background:#eef7ee;color:#2f7d32;}
  .c-orange{background:#fff1e0;color:#b35a00;}
  .c-yellow{background:#fdf6d8;color:#8a6d00;}
  .c-purple{background:#f3eefb;color:#6b3fa0;}
  .c-pink{background:#fdeef5;color:#b0306a;}
  .c-teal{background:#e6f6f4;color:#0f766e;}
  .c-brown{background:#f4ede6;color:#7a4b2a;}
  .c-gray{background:#f0f0f0;color:#555555;}
  .crow{padding:12px 0;border-bottom:1px solid var(--line-soft);}
  .crow .tag{display:inline-block;margin-bottom:10px;font-size:13px;}
  .sw{display:flex;gap:8px;flex-wrap:wrap;}
  .sw button{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
  .sw button.on{border-color:var(--text);}
  #colorList{max-height:60vh;overflow-y:auto;margin-bottom:12px;}
  .name{font-size:15px;font-weight:700;}
  .desc{font-size:13px;color:var(--muted);line-height:1.5;}
  .card .tag{cursor:pointer;padding:4px 10px;}
  .filter{display:flex;align-items:center;gap:8px;padding:0 16px 10px;font-size:13px;color:var(--muted);}
  .filter[hidden]{display:none;}
  .chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:99px;
        border:1px solid var(--accent);background:#eef4fb;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;}
  .sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .sugg button{height:32px;padding:0 10px;border-radius:6px;border:1px dashed var(--btn-line);
        background:#fff;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;}
  .backup{display:flex;gap:8px;padding:8px 16px 28px;border-top:1px solid var(--line-soft);margin:0 16px;}
  .backup .btn{height:44px;font-size:13px;color:var(--muted);background:var(--btn);}
  .empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:40px 16px;}

  /* edit sheet */
  dialog{
    border:none;padding:0;width:100%;max-width:520px;margin:auto auto 0;
    border-radius:14px 14px 0 0;background:#fff;color:var(--text);
  }
  dialog::backdrop{background:rgba(0,0,0,.35);}
  .sheet{padding:18px 16px calc(18px + env(safe-area-inset-bottom));}
  .sheet h2{font-size:17px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field small{display:block;font-size:11px;color:var(--faint);margin-top:4px;}
  textarea{min-height:70px;resize:vertical;}
  .row{display:flex;gap:8px;margin-top:6px;}
  .btn{flex:1;height:46px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
       border:1px solid var(--btn-line);background:#fff;color:var(--text);font-family:inherit;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.del{flex:0 0 auto;padding:0 16px;color:var(--danger);}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">מלאי בר</div>
  <button class="add" id="addBtn" aria-label="פריט חדש">+</button>
</header>

<div class="search">
  <label for="q">חיפוש</label>
  <input id="q" type="search" placeholder="שם, תיאור או תגית">
</div>
<div class="count" id="count"></div>
<div class="filter" id="filter" hidden>
  מסונן לפי:
  <button class="chip" id="clearTag" aria-label="בטל סינון"><span id="tagName"></span> ✕</button>
</div>
<main class="list" id="list"></main>

<div class="backup">
  <button class="btn" id="exportBtn">ייצוא גיבוי</button>
  <button class="btn" id="importBtn">ייבוא גיבוי</button>
  <button class="btn" id="colorsBtn">צבעי תגיות</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<dialog id="dlg">
  <form class="sheet" id="form" method="dialog">
    <h2 id="dlgTitle">פריט חדש</h2>
    <div class="field"><label for="fName">שם</label><input id="fName" required></div>
    <div class="field"><label for="fDesc">תיאור</label><textarea id="fDesc"></textarea></div>
    <div class="field">
      <label for="fTags">תגיות</label><input id="fTags" placeholder="יין אדום, יבש">
      <small>מפרידים בפסיק</small>
      <div class="sugg" id="sugg"></div>
    </div>
    <div class="row">
      <button type="button" class="btn del" id="delBtn">מחק</button>
      <button type="button" class="btn" id="cancelBtn">ביטול</button>
      <button type="submit" class="btn primary">שמור</button>
    </div>
  </form>
</dialog>

<dialog id="colorDlg">
  <div class="sheet">
    <h2>צבעי תגיות</h2>
    <div id="colorList"></div>
    <div class="row"><button type="button" class="btn primary" id="colorDone">סיום</button></div>
  </div>
</dialog>

<script>
const KEY = "bar-inventory-v1";
const $ = id => document.getElementById(id);

let items = load();
let editId = null;
let activeTag = null;

function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(d)) return d;
  } catch(e){}
  // first run — sample data
  return [
    {id:1,name:"קברנה סוביניון",desc:"בקבוק 750 מ״ל, מדף עליון",tags:["יין אדום","יבש"]},
    {id:2,name:"שרדונה",desc:"בקבוק 750 מ״ל, במקרר",tags:["יין לבן"]},
    {id:3,name:"ג׳יימסון",desc:"בקבוק 1 ליטר, מאחורי הבר",tags:["וויסקי","אירי"]}
  ];
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---- tag colors ---- */
const COLOR_KEY = "bar-inventory-tagcolors-v1";
const PALETTE = ["blue", "red", "green", "orange", "yellow", "purple", "pink", "teal", "brown", "gray"];
let tagColors = {};
try { tagColors = JSON.parse(localStorage.getItem(COLOR_KEY)) || {}; } catch(e){}
function saveColors(){ try { localStorage.setItem(COLOR_KEY, JSON.stringify(tagColors)); } catch(e){} }

// chosen color, otherwise default by keyword
function tagColor(t){
  if (tagColors[t]) return tagColors[t];
  if (t.includes("אדום")) return "red";
  if (t.includes("לבן")) return "green";
  return "blue";
}
function tagClass(t){ return "tag c-" + tagColor(t); }

function render(){
  const q = $("q").value.trim().toLowerCase();
  const list = items.filter(it =>
    (!activeTag || it.tags.includes(activeTag)) &&
    (!q || [it.name, it.desc, ...it.tags].join(" ").toLowerCase().includes(q))
  );

  $("filter").hidden = !activeTag;
  $("tagName").textContent = activeTag || "";

  $("count").textContent = list.length + " פריטים";

  if (!items.length){
    $("list").innerHTML = '<div class="empty">אין עדיין פריטים.<br>לחץ + כדי להוסיף את הראשון.</div>';
    return;
  }
  if (!list.length){
    $("list").innerHTML = '<div class="empty">לא נמצאו פריטים</div>';
    return;
  }

  $("list").innerHTML = list.map(it => `
    <button class="card" data-id="${it.id}">
      <div class="body">
        ${it.tags.length ? `<div class="tags">${it.tags.map(t => `<span class="${tagClass(t)}" data-tag="${esc(t)}">${esc(t)}</span>`).join("")}</div>` : ""}
        <div class="name">${esc(it.name)}</div>
        ${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ""}
      </div>
    </button>`).join("");
}

function openEdit(id){
  editId = id;
  const it = items.find(x => x.id === id) || {name:"",desc:"",tags:[]};
  $("dlgTitle").textContent = id ? "עריכת פריט" : "פריט חדש";
  $("fName").value = it.name;
  $("fDesc").value = it.desc;
  $("fTags").value = it.tags.join(", ");
  $("delBtn").style.display = id ? "" : "none";
  renderSugg();
  $("dlg").showModal();
}

$("form").addEventListener("submit", () => {
  const data = {
    name: $("fName").value.trim(),
    desc: $("fDesc").value.trim(),
    tags: $("fTags").value.split(",").map(t => t.trim()).filter(Boolean)
  };
  if (editId) Object.assign(items.find(x => x.id === editId), data);
  else items.unshift({ id: Date.now(), ...data });
  save(); render();
});

$("delBtn").onclick = () => {
  if (!confirm("למחוק את הפריט?")) return;
  items = items.filter(x => x.id !== editId);
  save(); render(); $("dlg").close();
};
$("cancelBtn").onclick = () => $("dlg").close();
$("addBtn").onclick = () => openEdit(null);
$("q").addEventListener("input", render);
$("list").addEventListener("click", e => {
  const tag = e.target.closest("[data-tag]");
  if (tag){ activeTag = tag.dataset.tag; render(); scrollTo(0, 0); return; }
  const card = e.target.closest(".card");
  if (card) openEdit(Number(card.dataset.id));
});
$("clearTag").onclick = () => { activeTag = null; render(); };

/* ---- tag suggestions ---- */
function currentTags(){ return $("fTags").value.split(",").map(t => t.trim()).filter(Boolean); }
function renderSugg(){
  const used = currentTags();
  const typing = ($("fTags").value.split(",").pop() || "").trim();
  const all = [...new Set(items.flatMap(it => it.tags))];
  const list = all.filter(t => !used.includes(t) && (!typing || t.includes(typing)));
  $("sugg").innerHTML = list.map(t => `<button type="button" data-s="${esc(t)}">+ ${esc(t)}</button>`).join("");
}
$("fTags").addEventListener("input", renderSugg);
$("sugg").addEventListener("click", e => {
  const b = e.target.closest("[data-s]");
  if (!b) return;
  const parts = $("fTags").value.split(",").map(t => t.trim());
  // replace the part being typed, or append
  const last = parts[parts.length - 1];
  if (last && !b.dataset.s.includes(last)) parts.push(b.dataset.s);
  else parts[parts.length - 1] = b.dataset.s;
  $("fTags").value = parts.filter(Boolean).join(", ") + ", ";
  $("fTags").focus();
  renderSugg();
});

/* ---- backup ---- */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ items, tagColors }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bar-inventory-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    // supports old backups (plain array) and new ones ({items, tagColors})
    const data = Array.isArray(raw) ? raw : raw && raw.items;
    if (!Array.isArray(data) || !data.every(x => x && typeof x.name === "string"))
      throw new Error();
    if (!confirm("הייבוא יחליף את הרשימה הנוכחית (" + items.length + " פריטים) ב־" + data.length + " פריטים. להמשיך?")) return;
    items = data.map((x, i) => ({
      id: x.id || Date.now() + i,
      name: x.name,
      desc: x.desc || "",
      tags: Array.isArray(x.tags) ? x.tags.map(String) : []
    }));
    if (raw.tagColors && typeof raw.tagColors === "object"){ tagColors = raw.tagColors; saveColors(); }
    activeTag = null; save(); render();
  } catch {
    alert("הקובץ לא תקין");
  }
};

/* ---- color picker ---- */
function renderColors(){
  const tags = [...new Set(items.flatMap(it => it.tags))].sort((a, b) => a.localeCompare(b, "he"));
  $("colorList").innerHTML = tags.length ? tags.map(t => `
    <div class="crow">
      <span class="${tagClass(t)}">${esc(t)}</span>
      <div class="sw">
        ${PALETTE.map(c => `<button type="button" class="c-${c}${tagColor(t) === c ? " on" : ""}"
            data-t="${esc(t)}" data-c="${c}" aria-label="${c}"></button>`).join("")}
      </div>
    </div>`).join("") : '<div class="empty">אין עדיין תגיות</div>';
}
$("colorsBtn").onclick = () => { renderColors(); $("colorDlg").showModal(); };
$("colorDone").onclick = () => $("colorDlg").close();
$("colorList").addEventListener("click", e => {
  const b = e.target.closest("[data-c]");
  if (!b) return;
  tagColors[b.dataset.t] = b.dataset.c;
  saveColors(); renderColors(); render();
});

render();
</script>
</body>
</html>
